# LightGBM quantile models (one per quantile). `params` go to LGBMRegressor.
lightgbm:
  n_estimators: 500
  seed: 42
  refit: monthly
  params:
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    colsample_bytree: 0.8
    subsample: 0.8
    subsample_freq: 1
    reg_lambda: 1.0
