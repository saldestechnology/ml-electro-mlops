[project]
name = "pricefc"
version = "0.1.0"
description = "Swedish day-ahead electricity price forecasting, versioned with MLflow"
authors = [{ name = "johan", email = "johan@itkonsult.net" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pyyaml>=6",
    "pydantic>=2.7",
    "typer>=0.12",
    "mlflow>=2.14",
    "requests>=2.32",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pandera>=0.33.1",
    "entsoe-py>=0.8.1",
    "holidays>=0.105",
    "statsforecast>=2.0.1",
    "scipy>=1.18.1",
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
local-mac = []
gpu-cuda = []
# Foundation models (M5); optional so CI and the base install stay free of torch.
timesfm = [
    "timesfm[torch]==3.0.2",
    "torch>=2.4",  # direct, so the Linux CPU-only index in [tool.uv.sources] applies
    "mlx>=0.32; sys_platform == 'darwin'",  # TimesFM 3.0 Apple-silicon backend
]
# TimesFM 2.5 covariates (XReg) need jax + scikit-learn (upstream "xreg" pins jax[cuda]).
# Research only: the deployable models do not use XReg, so the serving image omits it.
timesfm-xreg = ["pricefc[timesfm]", "jax>=0.7", "scikit-learn>=1.5"]
# Scheduling and serving on the VPS (M6).
serve = ["prefect>=3.8"]

[project.scripts]
pricefc = "pricefc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls real external APIs; run with `make test-live`"]

# Linux (VPS, containers): CPU-only torch wheels instead of the default CUDA build (~2 GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
