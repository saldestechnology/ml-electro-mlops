# Grafana on the backup VPS, localhost only: ssh -N -L 3000:127.0.0.1:3000 pricefc-backup
[server]
http_addr = 127.0.0.1
http_port = 3000

[paths]
data = /home/pricefc-backup/monitoring/grafana
logs = /home/pricefc-backup/monitoring/grafana/log
plugins = /home/pricefc-backup/monitoring/grafana/plugins
provisioning = /home/pricefc-backup/.config/pricefc-monitoring/grafana/provisioning

[security]
admin_user = admin
admin_password = $__file{/home/pricefc-backup/.config/pricefc-monitoring/grafana_admin_password}
disable_gravatar = true
cookie_samesite = strict

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[unified_alerting]
# Alerts live in Prometheus rules + Alertmanager; Grafana only shows them.
enabled = false

[alerting]
enabled = false
