name: Deliver
# main  -> CI -> image (GHCR, tagged by commit) -> staging (automatic)
# release published -> production: the SAME image digest that went through staging, after
# approval in the `production` environment. Images are never rebuilt for production.
on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: deliver-${{ github.event_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/saldestechnology/ml-electro-mlops

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Containerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy ${{ needs.image.outputs.ref }}
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$TARGET" deploy "${{ needs.image.outputs.ref }}"

  production:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      deployments: read
      packages: read
    steps:
      - name: Require a successful staging deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${{ github.repository }}/deployments?environment=staging&sha=${{ github.sha }}" \
                 --jq '.[].statuses_url' | while read -r u; do gh api "$u" --jq '.[0].state'; done | grep -c '^success$' || true)
          [ "$ok" -ge 1 ] || { echo "commit ${{ github.sha }} has no successful staging deployment"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the image built for this commit
        id: img
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${{ github.sha }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy ${{ steps.img.outputs.ref }}
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$TARGET" deploy "${{ steps.img.outputs.ref }}"
